<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0C0B09;color:#fff;font-family:'Manrope',Arial,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}

p{color:#8A8A8A;font-size:15px;line-height:1.7;margin-bottom:30px}
.btn{display:inline-block;font-family:'Oswald',Impact,sans-serif;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#0C0B09;background:#FFC000;padding:16px 38px;text-decoration:none;transition:background .25s}
.btn:hover{background:#FFD84D}
.btn2{display:inline-block;margin-left:14px;font-family:'Oswald',Impact,sans-serif;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#fff;border:1px solid rgba(255,255,255,.25);padding:15px 30px;text-decoration:none;transition:border-color .25s}
.btn2:hover{border-color:#FFC000}
.tel{display:block;margin-top:26px;font-family:'Oswald',Impact,sans-serif;font-size:20px;letter-spacing:.08em;color:#FFC000;text-decoration:none}
